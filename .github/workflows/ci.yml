name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - name: Benchmark smoke test
        run: |
          go run ./cmd/email-pipeline generate --output assessment-smoke.csv --count 10000 --seed 7 > generate-smoke.json
          go run ./cmd/email-pipeline run --input assessment-smoke.csv --workers 2 > run-smoke.json
          test "$(jq -r '.expected.count' generate-smoke.json)" = "$(jq -r '.counts.examined' run-smoke.json)"
          test "$(jq -r '.expected.count' generate-smoke.json)" = "$(jq -r '.counts.completed' run-smoke.json)"
          test "$(jq -r '.expected.named' generate-smoke.json)" = "5000"
          test "$(jq -r '.expected.fallback' generate-smoke.json)" = "5000"
          test "$(jq -r '.counts.invalid + .counts.duplicate + .counts.failed + .counts.unprocessed' run-smoke.json)" = "0"

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/distributed
      - run: go test -race -shuffle=on -count=1 ./internal/distributed
